<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دردشة مهند</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111827;
      color: white;
    }
    main {
      max-width: 700px;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    h1 { text-align: center; font-size: 22px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user { background: #2563eb; }
    .bot { background: #374151; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>دردشة مهند</h1>
    <div id="chat"></div>
    <form id="form">
      <input id="input" placeholder="اكتب رسالتك..." required>
      <button id="send" type="submit">إرسال</button>
    </form>
  </main>

<script>
    const API_URL = "";
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const messages = [];

function show(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

show("أهلاً فيك! اكتب رسالتك هون", "bot");

form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

show(text, "user");
      input.value = "";

if (!API_URL) {
        show("خدمة الردود لسا ما انربطت", "bot");
        return;
      }

send.disabled = true;
      const requestMessages = [...messages, { role: "user", content: text }];

try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: requestMessages })
        });
        if (!response.ok) throw new Error("request failed");
        const data = await response.json();
        if (typeof data.reply !== "string" || !data.reply.trim()) {
          throw new Error("empty reply");
        }
        messages.push({ role: "user", content: text });
        messages.push({ role: "assistant", content: data.reply });
        show(data.reply, "bot");
      } catch (error) {
        show("ما قدرت أوصل لخدمة الردود، جرّب مرة تانية", "bot");
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
